<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create and test mock REST endpoints with MockHub" />
    <title>MockHub</title>
    <script>
      // Applies the saved (or system) color scheme before the app loads, to avoid a flash of the wrong theme.
      try {
        var saved = localStorage.getItem('mantine-color-scheme-value')
        var scheme = saved === 'light' || saved === 'dark' ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-mantine-color-scheme', scheme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
